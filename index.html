<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a63">
<meta name="description" content="MissionLog ۲۰۲۷ — ثبت مأموریت‌های کاری روزانه و تولید گزارش PDF حرفه‌ای">
<title>MissionLog ۲۰۲۷ — ثبت مأموریت‌های کاری</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- PDF engines (real PDF output) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

<style>
/* =========================================================================
   1. DESIGN TOKENS
   ========================================================================= */
:root{
  --font: "Vazirmatn", "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;

  --bg:#f6f6f3;
  --surface:#ffffff;
  --surface-2:#fbfbf9;
  --surface-3:#f1f1ed;
  --border:#e7e6e0;
  --border-strong:#d9d8d1;

  --text:#121614;
  --text-2:#454c48;
  --muted:#7a817c;

  --accent:#0f7a63;
  --accent-2:#0a5c4a;
  --accent-soft:#e7f3ef;
  --accent-ink:#064e3f;

  --danger:#b3261e;
  --danger-soft:#fdeceb;
  --warn:#8a5a00;
  --warn-soft:#fdf4e0;
  --info:#1e5b8a;
  --info-soft:#e8f1f8;

  --shadow-xs:0 1px 2px rgba(18,26,22,.04);
  --shadow-sm:0 1px 2px rgba(18,26,22,.05), 0 2px 6px -2px rgba(18,26,22,.05);
  --shadow-md:0 6px 20px -8px rgba(18,26,22,.12), 0 2px 6px -2px rgba(18,26,22,.06);
  --shadow-lg:0 28px 60px -28px rgba(18,26,22,.28), 0 8px 24px -12px rgba(18,26,22,.12);

  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --ring:0 0 0 3px rgba(15,122,99,.22);
}
[data-theme="dark"]{
  --bg:#0a0d0c;
  --surface:#121615;
  --surface-2:#161b1a;
  --surface-3:#1c2221;
  --border:#232a28;
  --border-strong:#2e3634;

  --text:#eef2f0;
  --text-2:#b9c2be;
  --muted:#828c88;

  --accent:#3fbd9e;
  --accent-2:#2ea88b;
  --accent-soft:#0f2a24;
  --accent-ink:#a9ecd9;

  --danger:#f2776c;
  --danger-soft:#2a1513;
  --warn:#e3b341;
  --warn-soft:#2a2109;
  --info:#7ab6e0;
  --info-soft:#0f1e2a;

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 2px 8px -2px rgba(0,0,0,.5);
  --shadow-md:0 8px 24px -10px rgba(0,0,0,.7), 0 2px 8px -2px rgba(0,0,0,.5);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.85), 0 10px 30px -14px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(63,189,158,.28);
}

/* =========================================================================
   2. BASE
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.75;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.ico-sm{width:16px;height:16px}
.ico-lg{width:24px;height:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =========================================================================
   3. SHELL / NAVIGATION
   ========================================================================= */
.shell{min-height:100vh;min-height:100dvh}
.sidebar{display:none}
.main{min-height:100vh;min-height:100dvh;padding-bottom:104px}
.page{max-width:1120px;margin:0 auto;padding:16px 14px 32px}
@media(min-width:768px){ .page{padding:24px 28px 40px} .main{padding-bottom:40px} }

.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1120px;margin:0 auto;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
}
@media(min-width:768px){ .topbar-in{padding:12px 28px} }

.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(150deg,var(--accent),var(--accent-2));
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;
  box-shadow:0 6px 16px -8px rgba(15,122,99,.7);
  letter-spacing:-.5px;
}
[data-theme="dark"] .brand-mark{color:#04211b}
.brand-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--muted);font-weight:400}
@media(max-width:420px){ .brand-sub{display:none} }

.topbar-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}

.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid transparent;
  background:transparent;color:var(--text-2);display:grid;place-items:center;
  transition:background .16s ease,color .16s ease,border-color .16s ease,transform .12s ease;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.icon-btn.bordered{border-color:var(--border);background:var(--surface)}

/* Bottom nav (mobile) */
.bottomnav{
  position:fixed;inset-inline:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--border);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
}
.nav-item{
  border:0;background:transparent;border-radius:14px;padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--muted);font-size:11px;font-weight:500;
  transition:color .16s ease,background .16s ease;
}
.nav-item .ico{transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.nav-item.active{color:var(--accent);background:var(--accent-soft)}
.nav-item.active .ico{transform:translateY(-1px) scale(1.05)}
.nav-item:active{background:var(--surface-3)}
@media(min-width:1024px){ .bottomnav{display:none} }

/* Desktop sidebar */
@media(min-width:1024px){
  .shell{display:grid;grid-template-columns:266px minmax(0,1fr)}
  .sidebar{
    display:flex;flex-direction:column;gap:6px;
    padding:22px 16px;border-inline-end:1px solid var(--border);
    background:var(--surface-2);position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{padding:0 6px 18px}
  .side-label{font-size:11px;font-weight:600;color:var(--muted);padding:14px 10px 6px;letter-spacing:.02em}
  .side-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
    border:0;background:transparent;color:var(--text-2);font-size:14px;font-weight:500;
    transition:background .16s,color .16s;text-align:start;
  }
  .side-item:hover{background:var(--surface-3);color:var(--text)}
  .side-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  [data-theme="dark"] .side-item.active{color:var(--accent)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
  .topbar{background:transparent;backdrop-filter:none;border-bottom:0}
  .topbar-in{padding:18px 28px 0;max-width:1120px}
  .topbar .brand{display:none}
  .main{min-height:100vh}
}

/* =========================================================================
   4. PRIMITIVES
   ========================================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:0 16px;height:44px;border-radius:12px;font-weight:600;font-size:14px;
  transition:background .16s,border-color .16s,box-shadow .16s,transform .12s,color .16s;
  white-space:nowrap;user-select:none;
}
.btn:hover{background:var(--surface-3);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary{
  background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 8px 20px -12px rgba(15,122,99,.9), 0 1px 0 rgba(255,255,255,.12) inset;
}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
[data-theme="dark"] .btn-primary{color:#04211b}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{filter:brightness(.93)}
.btn-sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn .ico{width:18px;height:18px}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
}
.card-pad{padding:16px}
@media(min-width:768px){ .card-pad{padding:20px} }

.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-title .ico{color:var(--accent);width:18px;height:18px}
.card-sub{font-size:12px;color:var(--muted);font-weight:400}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-3);
  color:var(--text-2);border:1px solid transparent;
}
.chip-accent{background:var(--accent-soft);color:var(--accent-ink)}
[data-theme="dark"] .chip-accent{color:var(--accent)}
.chip-warn{background:var(--warn-soft);color:var(--warn)}
.chip-danger{background:var(--danger-soft);color:var(--danger)}
.chip-outline{background:transparent;border-color:var(--border);color:var(--muted)}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.2px}
.section-desc{font-size:12.5px;color:var(--muted);margin-top:2px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--text-2)}
.input,.select,textarea.input{
  width:100%;height:46px;padding:0 13px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  transition:border-color .16s,box-shadow .16s,background .16s;font-size:14px;
}
.input:hover,.select:hover{border-color:var(--border-strong)}
.input:focus,.select:focus,textarea.input:focus{
  outline:none;border-color:var(--accent);background:var(--surface);box-shadow:var(--ring)
}
textarea.input{height:auto;min-height:92px;padding:11px 13px;resize:vertical;line-height:1.8}
.select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%237a817c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:left 12px center;padding-inline-start:36px;
}
.hint{font-size:11.5px;color:var(--muted)}
.err{font-size:12px;color:var(--danger);font-weight:500}
.date-field{
  display:flex;align-items:center;gap:9px;width:100%;height:46px;padding:0 13px;
  border-radius:12px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);font-size:14px;font-weight:500;text-align:start;
  transition:border-color .16s,box-shadow .16s;
}
.date-field:hover{border-color:var(--border-strong)}
.date-field .ico{color:var(--muted);width:18px;height:18px}
.date-field .df-empty{color:var(--muted);font-weight:400}

/* =========================================================================
   5. DASHBOARD
   ========================================================================= */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(120% 160% at 100% 0%, rgba(15,122,99,.10) 0%, transparent 55%),
    radial-gradient(90% 120% at 0% 100%, rgba(15,122,99,.06) 0%, transparent 60%),
    var(--surface);
  border:1px solid var(--border);border-radius:var(--r-xl);
  padding:20px;box-shadow:var(--shadow-sm);
}
@media(min-width:768px){ .hero{padding:26px 28px} }
.hero-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hero-eyebrow{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.hero-title{font-size:clamp(20px,5.4vw,30px);font-weight:700;letter-spacing:-.7px;line-height:1.4}
.hero-sub{font-size:13px;color:var(--muted);margin-top:6px}
.hero-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hero-actions .btn{flex:1 1 auto}
@media(min-width:560px){ .hero-actions .btn{flex:0 0 auto} }

.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px;
}
@media(min-width:900px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px} }
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px;box-shadow:var(--shadow-xs);position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.stat::after{
  content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;
  border-radius:3px;background:var(--accent);opacity:.9;
}
.stat[data-tone="blue"]::after{background:var(--info)}
.stat[data-tone="amber"]::after{background:var(--warn)}
.stat[data-tone="slate"]::after{background:var(--border-strong)}
.stat-top{display:flex;align-items:center;gap:7px;color:var(--muted)}
.stat-ico{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;
  background:var(--surface-3);color:var(--text-2)}
.stat-ico .ico{width:14px;height:14px}
.stat-label{font-size:11.5px;font-weight:600}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1.3;margin-top:6px}
.stat-hint{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid-2{display:grid;gap:14px;margin-top:14px}
@media(min-width:900px){ .grid-2{grid-template-columns:1.05fr .95fr} }

/* Bars */
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;align-items:center;gap:10px;padding:7px 0}
.bar-name{font-size:12.5px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar-val{font-size:12.5px;font-weight:700;text-align:end;font-variant-numeric:tabular-nums}

/* Mission rows */
.mrow{
  display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;
  border:1px solid transparent;transition:background .16s,border-color .16s;
}
.mrow:hover{background:var(--surface-2);border-color:var(--border)}
.mrow+.mrow{margin-top:2px}
.mrow-date{
  flex:none;width:48px;height:52px;border-radius:12px;background:var(--surface-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
}
.mrow-day{font-size:17px;font-weight:700;letter-spacing:-.5px}
.mrow-mon{font-size:9.5px;color:var(--muted);font-weight:500;margin-top:2px}
.mrow-main{min-width:0;flex:1}
.mrow-dest{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mrow-actions{display:flex;gap:2px;flex:none}
.mrow-actions .icon-btn{width:34px;height:34px;border-radius:10px}
.mrow-actions .ico{width:17px;height:17px}

/* Grouped history */
.group{margin-top:18px}
.group-head{
  display:flex;align-items:center;gap:9px;padding:8px 2px;margin-bottom:8px;
  position:sticky;top:var(--topbar-h,58px);z-index:5;
  background:color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.group-dot{width:8px;height:8px;border-radius:99px;background:var(--accent);flex:none}
.group-title{font-size:13px;font-weight:700}
.group-title span{color:var(--muted);font-weight:500;font-size:12px}
.group-count{margin-inline-start:auto;font-size:11px;color:var(--muted);font-weight:600}

/* Empty state */
.empty{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:38px 18px;gap:6px;
}
.empty-ico{
  width:56px;height:56px;border-radius:18px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);margin-bottom:6px;
}
.empty-ico .ico{width:26px;height:26px}
.empty-title{font-size:14.5px;font-weight:700}
.empty-desc{font-size:12.5px;color:var(--muted);max-width:320px;line-height:1.8}
.empty .btn{margin-top:12px}

/* =========================================================================
   6. FILTERS
   ========================================================================= */
.filters{margin-bottom:14px}
.filters-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.filters-title{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.filters-title .ico{width:17px;height:17px;color:var(--accent)}
.filters-actions{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.filters-body{display:grid;gap:11px;grid-template-columns:1fr}
@media(min-width:700px){ .filters-body{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media(min-width:1024px){ .filters-body{grid-template-columns:repeat(3,minmax(0,1fr))} }
.filters.collapsed .filters-body{display:none}
@media(min-width:768px){ .only-mobile{display:none!important} .filters .filters-body{display:grid!important} }
.range-2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.search-wrap{position:relative}
.search-wrap .ico{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:var(--muted);pointer-events:none}
.search-wrap .input{padding-inline-start:38px}

.result-bar{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:11px 14px;margin-bottom:4px;font-size:12.5px;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);
}
.result-bar strong{color:var(--text);font-weight:700}

/* =========================================================================
   7. REPORTS
   ========================================================================= */
.preset-row{display:flex;gap:7px;flex-wrap:wrap}
.preset{
  height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:600;
  transition:all .16s ease;
}
.preset:hover{border-color:var(--border-strong);background:var(--surface-3)}
.preset.active{background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 8px 18px -12px rgba(15,122,99,.9)}
[data-theme="dark"] .preset.active{color:#04211b}

.preview-grid{display:grid;gap:14px;margin-top:14px}
@media(min-width:900px){ .preview-grid{grid-template-columns:1fr 340px;align-items:start} }

.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.kv+.kv{border-top:1px dashed var(--border)}
.kv-k{font-size:12.5px;color:var(--muted)}
.kv-v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.big-total{
  display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 18%, transparent);
  margin-bottom:6px;
}
.big-total .n{font-size:34px;font-weight:700;letter-spacing:-1.5px;color:var(--accent-ink);line-height:1}
[data-theme="dark"] .big-total .n{color:var(--accent)}
.big-total .t{font-size:12px;color:var(--text-2);font-weight:600}
.big-total .s{font-size:11px;color:var(--muted)}

.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{
  text-align:start;font-weight:600;color:var(--muted);font-size:11.5px;
  padding:8px 10px;border-bottom:1px solid var(--border);
}
.dtable td{padding:9px 10px;border-bottom:1px solid var(--border)}
.dtable tr:last-child td{border-bottom:0}
.dtable .num{text-align:end;font-weight:700;font-variant-numeric:tabular-nums}

/* =========================================================================
   8. MODALS / SHEETS / TOASTS / DATE PICKER
   ========================================================================= */
.overlay{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(10,14,12,.44);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  padding:0;animation:fade .18s ease;
}
@media(min-width:640px){ .overlay{align-items:center;padding:24px} }
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal,.sheet{
  width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--border);border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-lg);animation:rise .24s cubic-bezier(.2,.8,.3,1);
  max-height:92dvh;display:flex;flex-direction:column;
}
@media(min-width:640px){ .modal,.sheet{border-radius:22px;max-height:88dvh} }
.sheet{max-width:440px}
.modal-head,.sheet-head{
  display:flex;align-items:center;gap:10px;padding:16px 16px 12px;
  border-bottom:1px solid var(--border);flex:none;
}
.modal-title,.sheet-title{font-size:15px;font-weight:700;flex:1;letter-spacing:-.2px}
.modal-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{
  display:flex;gap:9px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);flex:none;background:var(--surface-2);
}
@media(min-width:640px){ .modal-foot{padding-bottom:16px} }
.modal-foot .btn{flex:1}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.dest-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dest-opt{
  border:1px solid var(--border);background:var(--surface-2);border-radius:11px;
  padding:10px 8px;font-size:12.5px;font-weight:600;color:var(--text-2);
  transition:all .15s ease;text-align:center;
}
.dest-opt:hover{border-color:var(--border-strong)}
.dest-opt.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
[data-theme="dark"] .dest-opt.sel{color:var(--accent)}

/* date picker */
.dp-overlay{z-index:80}
.dp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 4px}
.dp-title{font-size:14px;font-weight:700}
.dp-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:8px 12px 4px;text-align:center}
.dp-week span{font-size:10.5px;color:var(--muted);font-weight:600;padding:4px 0}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px 12px;overflow-y:auto}
.dp-day{
  height:40px;border-radius:10px;border:1px solid transparent;background:transparent;
  font-size:13px;font-weight:500;color:var(--text);display:grid;place-items:center;
  transition:background .13s,color .13s,border-color .13s;font-variant-numeric:tabular-nums;
}
.dp-day:hover:not(:disabled){background:var(--surface-3)}
.dp-day.is-out{visibility:hidden;pointer-events:none}
.dp-day.is-today{border-color:var(--accent);color:var(--accent);font-weight:700}
.dp-day.is-sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
[data-theme="dark"] .dp-day.is-sel{color:#04211b}
.dp-day.is-fri{color:var(--danger)}
.dp-day.is-sel.is-fri{color:#fff}
.dp-day:disabled{opacity:.28;cursor:not-allowed}
.sheet-foot{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.sheet-foot .btn{flex:1;height:40px;font-size:13px}

/* toasts */
#toast-root{position:fixed;inset-inline:0;bottom:96px;z-index:120;display:flex;
  flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
@media(min-width:1024px){ #toast-root{bottom:24px} }
.toast{
  display:flex;align-items:center;gap:9px;max-width:440px;width:fit-content;
  background:var(--text);color:var(--bg);border-radius:13px;padding:10px 15px;
  font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);
  animation:toastIn .26s cubic-bezier(.2,.8,.3,1);
}
.toast .ico{width:17px;height:17px;flex:none}
.toast.success{background:#0b6b57;color:#fff}
.toast.error{background:#8f1f18;color:#fff}
.toast.warn{background:#7a5200;color:#fff}
@keyframes toastIn{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* loading overlay */
.loading-overlay{
  position:fixed;inset:0;z-index:300;display:grid;place-items:center;
  background:var(--bg);
}
.loading-box{display:flex;flex-direction:column;align-items:center;gap:14px}
.spinner{
  width:38px;height:38px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;font-weight:600;color:var(--text-2)}
.loading-sub{font-size:11.5px;color:var(--muted);margin-top:-8px}

/* =========================================================================
   9. PDF DOCUMENT (A4) — also used for native print
   ========================================================================= */
#pdf-stage{
  position:fixed;top:0;left:0;z-index:1;pointer-events:none;

}
.pdf-page{
  width:210mm;height:297mm;background:#ffffff;color:#101413;
  font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
  direction:rtl;text-align:right;
  padding:14mm 14mm 12mm 14mm;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  break-after:page;page-break-after:always;
}
.pdf-page *{box-sizing:border-box}
.pdf-head{width:100%;border-collapse:collapse;border-bottom:1.6pt solid #0f7a63;padding-bottom:0}
.pdf-head td{vertical-align:middle;padding:0 0 10px 0;border:0}
.pdf-mark{
  display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;
  border-radius:8px;background:#0f7a63;color:#fff;font-weight:700;font-size:15px;
  margin-inline-end:8px;vertical-align:middle;
}
.pdf-title{display:inline-block;vertical-align:middle;font-size:15pt;font-weight:700;color:#101413;line-height:1.35}
.pdf-title small{display:block;font-size:7.8pt;font-weight:400;color:#77807b;line-height:1.5;margin-top:1px}
.pdf-head .pdf-meta{text-align:left;vertical-align:middle}
.pdf-lbl{display:block;font-size:7.5pt;color:#77807b;font-weight:500}
.pdf-val{display:block;font-size:9.5pt;color:#101413;font-weight:700;margin-top:1px}

.pdf-sum{width:100%;border-collapse:collapse;margin-top:11px;table-layout:fixed}
.pdf-sum td{
  border:0.7pt solid #dbe6e1;background:#f4faf7;vertical-align:middle;
  padding:6px 7px;text-align:center;
}
.pdf-sum td.sum-hero{background:#0f7a63;border-color:#0f7a63;color:#fff;width:21%}
.pdf-sum .s-lbl{display:block;font-size:7.2pt;color:#4d5a55;font-weight:500;line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-sum td.sum-hero .s-lbl{color:#cdece2}
.pdf-sum .s-num{display:block;font-size:14pt;font-weight:700;color:#0b5f4d;line-height:1.35;margin-top:1px}
.pdf-sum td.sum-hero .s-num{color:#ffffff;font-size:17pt}

.pdf-table-wrap{flex:1 1 auto;overflow:hidden;margin-top:12px}
.pdf-table{width:100%;border-collapse:collapse;table-layout:fixed}
.pdf-table th{
  background:#eef6f2;color:#0b5f4d;font-size:8.6pt;font-weight:700;
  padding:7px 8px;border:0.7pt solid #dbe6e1;text-align:right;white-space:nowrap;
}
.pdf-table td{
  font-size:8.8pt;padding:0 8px;height:31px;line-height:31px;
  border:0.7pt solid #e6ebe8;color:#1a211e;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;
}
.pdf-table tbody tr:nth-child(even) td{background:#fafcfb}
.pdf-table td.c{text-align:center;font-variant-numeric:tabular-nums}
.pdf-table td.notes{color:#4d5a55;font-size:8.4pt}
.pdf-table td.empty-row{text-align:center;color:#8a938e;height:60px;line-height:60px}
.pdf-table th.c{text-align:center}

.pdf-foot{
  flex:none;width:100%;border-top:0.8pt solid #e0e6e3;margin-top:10px;padding-top:7px;
  font-size:7.8pt;color:#7c857f;
}
.pdf-foot table{width:100%;border-collapse:collapse}
.pdf-foot td{border:0;padding:0}
.pdf-foot .l{text-align:left;font-variant-numeric:tabular-nums}
.pdf-foot .pg{font-weight:700;color:#0f7a63}

/* native print */
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  .shell,.bottomnav,.topbar,#modal-root,#sheet-root,#toast-root,.loading-overlay{display:none!important}
  #pdf-stage{position:static!important;width:auto!important;pointer-events:auto}
  .pdf-page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .pdf-page:last-child{break-after:auto;page-break-after:auto}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.divider{height:1px;background:var(--border);margin:14px 0}
.row{display:flex;align-items:center;gap:9px}

.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* =========================================================================

/* ---------------------------- 1. JALALI CORE ---------------------------- */
const div = (a, b) => ~~(a / b);
const mod = (a, b) => a - ~~(a / b) * b;
const p2 = n => String(n).padStart(2, "0");

const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

function jalCal(jy, withoutLeap) {
  const bl = BREAKS.length;
  const gy = jy + 621;
  let leapJ = -14, jp = BREAKS[0], jm, jump = 0, leap = 0, n, i;
  if (jy < jp || jy >= BREAKS[bl - 1]) throw new Error("Invalid Jalaali year " + jy);
  for (i = 1; i < bl; i += 1) {
    jm = BREAKS[i];
    jump = jm - jp;
    if (jy < jm) break;
    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
    jp = jm;
  }
  n = jy - jp;
  leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (!withoutLeap) {
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
  }
  return { leap, gy, march };
}
function g2d(gy, gm, gd) {
  let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
        + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}
function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = div(mod(j, 1461), 4) * 5 + 308;
  const gd = div(mod(i, 153), 5) + 1;
  const gm = mod(div(i, 153), 12) + 1;
  const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
  return { gy, gm, gd };
}
function j2d(jy, jm, jd) {
  const r = jalCal(jy, true);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}
function d2j(jdn) {
  const gy = d2g(jdn).gy;
  let jy = gy - 621;
  const r = jalCal(jy, false);
  const jdn1f = g2d(gy, 3, r.march);
  let jd, jm, k = jdn - jdn1f;
  if (k >= 0) {
    if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 };
    k -= 186;
  } else {
    jy -= 1;
    k += 179;
    if (r.leap === 1) k += 1;
  }
  jm = 7 + div(k, 30);
  jd = mod(k, 30) + 1;
  return { jy, jm, jd };
}
const isLeapJalali = jy => jalCal(jy, false).leap === 0;
function jMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalali(jy) ? 30 : 29;
}

/* ---------------------------- 2. CONSTANTS ----------------------------- */
const DESTINATIONS = ["گمرک گرمسار", "گمرک سمنان", "گرمسار", "ایوانکی", "سمنان"];
const WEEKDAYS = ["شنبه", "یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه"];
const WEEKDAYS_SHORT = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
const JMONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
                 "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const WORKWEEK_LEN = 4; // Saturday(0) .. Wednesday(4)

const STORE_KEY = "missionlog2027:missions:v1";
const THEME_KEY = "missionlog2027:theme";

/* ---------------------------- 3. HELPERS ------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad2 = n => String(n).padStart(2, "0");
const isoOf = (jy, jm, jd) => `${jy}-${pad2(jm)}-${pad2(jd)}`;
const faNum = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[+d]);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const truncate = (s, n) => (s && s.length > n ? s.slice(0, n).trimEnd() + "…" : (s || ""));
const icon = (name, cls = "") =>
  `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;

function jdnToDate(jdn) { const g = d2g(jdn); return new Date(Date.UTC(g.gy, g.gm - 1, g.gd)); }
function jdnOf(iso) { const [y, m, d] = iso.split("-").map(Number); return j2d(y, m, d); }
function isoFromJdn(jdn) { const j = d2j(jdn); return isoOf(j.jy, j.jm, j.jd); }
function todayISO() {
  const n = new Date();
  return isoFromJdn(g2d(n.getFullYear(), n.getMonth() + 1, n.getDate()));
}
/** 0 = Saturday … 6 = Friday */
function weekdayOf(iso) { return (jdnToDate(jdnOf(iso)).getUTCDay() + 1) % 7; }
function fmtLong(iso) {
  const [jy, jm, jd] = iso.split("-").map(Number);
  return `${faNum(jd)} ${JMONTHS[jm - 1]} ${faNum(jy)}`;
}
function fmtWeekday(iso) { return WEEKDAYS[weekdayOf(iso)]; }
function fmtFull(iso) { return `${fmtWeekday(iso)} ${fmtLong(iso)}`; }
function isValidISO(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const [y, m, d] = iso.split("-").map(Number);
  if (m < 1 || m > 12 || d < 1) return false;
  try { return d <= jMonthLength(y, m); } catch { return false; }
}
function weekStartOf(iso) { return isoFromJdn(jdnOf(iso) - weekdayOf(iso)); }
/** Saturday → Wednesday of the week containing `iso` */
function workweekRange(iso) {
  const s = weekStartOf(iso);
  return [s, isoFromJdn(jdnOf(s) + WORKWEEK_LEN)];
}
function monthRange(iso) {
  const [jy, jm] = iso.split("-").map(Number);
  return [isoOf(jy, jm, 1), isoOf(jy, jm, jMonthLength(jy, jm))];
}
function shiftMonth(iso, delta) {
  let [jy, jm] = iso.split("-").map(Number);
  jm += delta;
  while (jm > 12) { jm -= 12; jy += 1; }
  while (jm < 1) { jm += 12; jy -= 1; }
  return isoOf(jy, jm, 1);
}

/* ---------------------------- 5. STORAGE ------------------------------- */
function loadMissions() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(arr)) return [];
    return arr.filter(m => m && typeof m.id === "string" && isValidISO(m.date)
      && DESTINATIONS.includes(m.dest)).map(m => ({
        id: m.id, date: m.date, dest: m.dest,
        notes: typeof m.notes === "string" ? m.notes.slice(0, 500) : "",
        createdAt: Number(m.createdAt) || Date.now(),
        updatedAt: Number(m.updatedAt) || Number(m.createdAt) || Date.now()
      }));
  } catch (e) { console.warn("load failed", e); return []; }
}
function persist() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state.missions));
    return true;
  } catch (e) {
    toast("ذخیره‌سازی ناموفق بود. فضای مرورگر پر شده است.", "error");
    return false;
  }
}
function sortDesc(list) {
  return list.slice().sort((a, b) =>
    a.date === b.date ? (b.createdAt - a.createdAt) : (a.date < b.date ? 1 : -1));
}
function sortAsc(list) {
  return list.slice().sort((a, b) =>
    a.date === b.date ? (a.createdAt - b.createdAt) : (a.date < b.date ? -1 : 1));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------------------------- 6. THEME --------------------------------- */
function applyTheme(t) {
  state.theme = t;
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t === "dark" ? "#0a0d0c" : "#0f7a63");
  $$("[data-act='theme']").forEach(b => {
    b.innerHTML = t === "dark"
      ? icon("sun") + (b.classList.contains("side-item") ? '<span data-theme-label>حالت روشن</span>' : "")
      : icon("moon") + (b.classList.contains("side-item") ? '<span data-theme-label>حالت تاریک</span>' : "");
    if (b.classList.contains("icon-btn")) b.setAttribute("aria-label", t === "dark" ? "حالت روشن" : "حالت تاریک");
  });
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch {}
  if (!saved) saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved);
}

/* ---------------------------- 7. TOASTS / DIALOGS ---------------------- */
function toast(msg, type = "default") {
  const root = $("#toast-root");
  const el = document.createElement("div");
  el.className = "toast " + (type === "default" ? "" : type);
  const ico = type === "success" ? "check" : type === "error" ? "alert" : type === "warn" ? "alert" : "check";
  el.innerHTML = icon(ico) + `<span>${esc(msg)}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .25s, transform .25s";
    el.style.opacity = "0"; el.style.transform = "translateY(8px)";
    setTimeout(() => el.remove(), 260);
  }, 2800);
}

function lockScroll(on) {
  document.body.style.overflow = on ? "hidden" : "";
}

/** Generic modal. Returns the overlay element. */
function openModal({ title, bodyHTML, footHTML, onMount, size }) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.id = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" ${size ? `style="max-width:${size}"` : ""}>
      <div class="modal-head">
        <div class="modal-title">${esc(title)}</div>
        <button class="icon-btn" data-close aria-label="بستن">${icon("x")}</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      ${footHTML ? `<div class="modal-foot">${footHTML}</div>` : ""}
    </div>`;
  $("#modal-root").appendChild(overlay);
  lockScroll(true);
  overlay.addEventListener("click", e => {
    if (e.target === overlay) closeModal();
  });
  overlay.querySelector("[data-close]").addEventListener("click", closeModal);
  if (onMount) onMount(overlay);
  const first = overlay.querySelector("input,select,textarea,button:not([data-close])");
  if (first) setTimeout(() => first.focus({ preventScroll: true }), 60);
  return overlay;
}
function closeModal() {
  const o = $("#modal-overlay");
  if (o) o.remove();
  lockScroll(!!$("#sheet-root").firstElementChild);
}

/** Confirmation dialog → Promise<boolean> */
function confirmDialog({ title, message, confirmText = "تأیید", cancelText = "انصراف", danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.style.zIndex = "90";
    overlay.innerHTML = `
      <div class="sheet" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-head">
          <div class="sheet-title">${esc(title)}</div>
          <button class="icon-btn" data-no aria-label="بستن">${icon("x")}</button>
        </div>
        <div style="padding:18px 16px;font-size:13.5px;line-height:1.9;color:var(--text-2)">${message}</div>
        <div class="sheet-foot">
          <button class="btn btn-ghost" data-no>${esc(cancelText)}</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-yes>${esc(confirmText)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    lockScroll(true);
    const close = v => { overlay.remove(); lockScroll(!!$("#modal-overlay")); finish(v); };
    overlay.querySelector("[data-yes]").addEventListener("click", () => close(true));
    overlay.querySelectorAll("[data-no]").forEach(b => b.addEventListener("click", () => close(false)));
    overlay.addEventListener("click", e => { if (e.target === overlay) close(false); });
    setTimeout(() => overlay.querySelector("[data-yes]").focus(), 60);
  });
}

/* ---------------------------- 8. DATE PICKER --------------------------- */
function openDatePicker(initialISO, onPick, opts = {}) {
  const max = opts.max || null;
  let sel = isValidISO(initialISO || "") ? initialISO : todayISO();
  let [vy, vm] = sel.split("-").map(Number);
  const today = todayISO();

  const overlay = document.createElement("div");
  overlay.className = "overlay dp-overlay";
  overlay.innerHTML = `
    <div class="sheet" role="dialog" aria-modal="true" aria-label="انتخاب تاریخ">
      <div class="sheet-head">
        <div class="sheet-title">انتخاب تاریخ</div>
        <button class="icon-btn" data-x aria-label="بستن">${icon("x")}</button>
      </div>
      <div class="dp-nav">
        <button class="icon-btn" data-prev aria-label="ماه قبل">${icon("chevron-right")}</button>
        <div class="dp-title" data-mtitle></div>
        <button class="icon-btn" data-next aria-label="ماه بعد">${icon("chevron-left")}</button>
      </div>
      <div class="dp-week">${WEEKDAYS_SHORT.map(w => `<span>${w}</span>`).join("")}</div>
      <div class="dp-grid" data-grid style="max-height:46vh"></div>
      <div class="sheet-foot">
        <button class="btn btn-ghost" data-today>امروز</button>
        <button class="btn btn-ghost" data-yday>دیروز</button>
      </div>
    </div>`;
  $("#sheet-root").appendChild(overlay);
  lockScroll(true);

  const grid = overlay.querySelector("[data-grid]");
  const mtitle = overlay.querySelector("[data-mtitle]");

  function draw() {
    mtitle.textContent = `${JMONTHS[vm - 1]} ${faNum(vy)}`;
    const lead = weekdayOf(isoOf(vy, vm, 1));
    const len = jMonthLength(vy, vm);
    let html = "";
    for (let i = 0; i < lead; i++) html += `<span class="dp-day is-out"></span>`;
    for (let d = 1; d <= len; d++) {
      const iso = isoOf(vy, vm, d);
      const wd = (lead + d - 1) % 7;
      const isFuture = max && iso > max;
      html += `<button class="dp-day ${wd === 6 ? "is-fri" : ""} ${iso === today ? "is-today" : ""} ${iso === sel ? "is-sel" : ""}"
        data-d="${iso}" ${isFuture ? "disabled" : ""} aria-label="${fmtFull(iso)}">${faNum(d)}</button>`;
    }
    grid.innerHTML = html;
  }
  function close() {
    overlay.remove();
    lockScroll(!!$("#modal-overlay"));
  }
  overlay.querySelector("[data-x]").addEventListener("click", close);
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  overlay.querySelector("[data-prev]").addEventListener("click", () => {
    const s = shiftMonth(isoOf(vy, vm, 1), -1);
    [vy, vm] = s.split("-").map(Number); draw();
  });
  overlay.querySelector("[data-next]").addEventListener("click", () => {
    const s = shiftMonth(isoOf(vy, vm, 1), 1);
    [vy, vm] = s.split("-").map(Number); draw();
  });
  overlay.querySelector("[data-today]").addEventListener("click", () => {
    sel = today; onPick(today); close();
  });
  overlay.querySelector("[data-yday]").addEventListener("click", () => {
    const y = isoFromJdn(jdnOf(today) - 1);
    if (max && y > max) return;
    onPick(y); close();
  });
  grid.addEventListener("click", e => {
    const b = e.target.closest("[data-d]");
    if (!b || b.disabled) return;
    onPick(b.dataset.d); close();
  });
  draw();
}

/* ---------------------------- 10. STATS -------------------------------- */
function destCounts(list) {
  const map = Object.fromEntries(DESTINATIONS.map(d => [d, 0]));
  list.forEach(m => { map[m.dest] = (map[m.dest] || 0) + 1; });
  return map;
}
function computeStats() {
  const t = todayISO();
  const [ws, we] = workweekRange(t);
  const [jy, jm] = t.split("-").map(Number);
  const inRange = (m, a, b) => m.date >= a && m.date <= b;
  return {
    t, ws, we, jy, jm,
    today: state.missions.filter(m => m.date === t),
    week: state.missions.filter(m => inRange(m, ws, we)),
    month: state.missions.filter(m => {
      const [y, mo] = m.date.split("-").map(Number);
      return y === jy && mo === jm;
    }),
    total: state.missions.length
  };
}

/* ---------------------------- 12. HISTORY VIEW ------------------------- */
function monthOptions() {
  const t = todayISO();
  let cur = isoOf(t.split("-")[0], t.split("-")[1], 1);
  const opts = [];
  for (let i = 0; i < 24; i++) {
    const [y, m] = cur.split("-").map(Number);
    opts.push({ value: `${y}-${pad2(m)}`, label: `${JMONTHS[m - 1]} ${faNum(y)}` });
    cur = shiftMonth(cur, -1);
  }
  return opts;
}
function matchFilters(m) {
  const f = state.filters;
  if (f.from && m.date < f.from) return false;
  if (f.to && m.date > f.to) return false;
  if (f.dest && m.dest !== f.dest) return false;
  if (f.weekday !== "" && weekdayOf(m.date) !== Number(f.weekday)) return false;
  if (f.month && !m.date.startsWith(f.month)) return false;
  if (f.q) {
    const q = f.q.trim().toLowerCase();
    const hay = [m.dest, m.notes || "", m.date, fmtWeekday(m.date), fmtLong(m.date)].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function openMissionForm(id) {

          ${DESTINATIONS.map(d => `<option value="${esc(d)}" ${draft.dest === d ? "selected" : ""}>${d}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label class="lbl" for="m-notes">توضیحات <span class="muted" style="font-weight:400">(اختیاری)</span></label>
        <textarea id="m-notes" class="input" maxlength="500" placeholder="مثلاً: بازدید و بررسی اسناد گمرکی…" data-notes></textarea>
        <div class="row-between">
          <span class="hint">می‌توانید خالی بگذارید.</span>
          <span class="hint tnum" data-count>۰ / ۵۰۰</span>
        </div>
      </div>
      <div class="err" data-err hidden></div>`,
    footHTML: `
      <button class="btn btn-ghost" data-cancel>انصراف</button>
      <button class="btn btn-primary" data-save>${editing ? "ذخیره تغییرات" : "ثبت مأموریت"}</button>`
  });

  const dateTxt = overlay.querySelector("[data-date-txt]");
  const wdChip = overlay.querySelector("[data-wd]");
  const warnChip = overlay.querySelector("[data-warn]");
  const notesEl = overlay.querySelector("[data-notes]");
  const countEl = overlay.querySelector("[data-count]");
  const errEl = overlay.querySelector("[data-err]");
  const saveBtn = overlay.querySelector("[data-save]");

  notesEl.value = draft.notes;

  function syncDate() {
    dateTxt.textContent = fmtLong(draft.date);
    const wd = weekdayOf(draft.date);
    wdChip.textContent = WEEKDAYS[wd];
    if (wd > WORKWEEK_LEN) {
      warnChip.hidden = false;
      warnChip.textContent = "خارج از هفته کاری (شنبه–چهارشنبه)";
    } else {
      warnChip.hidden = true;
    }
  }
  function syncCount() {
    countEl.textContent = `${faNum(notesEl.value.length)} / ۵۰۰`;
  }
  syncDate(); syncCount();

  overlay.querySelector("[data-pick]").addEventListener("click", () => {
    openDatePicker(draft.date, iso => { draft.date = iso; syncDate(); }, { max: todayISO() });
  });
  notesEl.addEventListener("input", syncCount);
  overlay.querySelector("[data-cancel]").addEventListener("click", closeModal);

  saveBtn.addEventListener("click", async () => {
    if (busy) return;
    errEl.hidden = true;

    const date = draft.date;
    const dest = overlay.querySelector("[data-dest]").value;
    const notes = notesEl.value.trim();

    if (!isValidISO(date)) { errEl.textContent = "تاریخ انتخاب‌شده معتبر نیست."; errEl.hidden = false; return; }
    if (date > todayISO()) { errEl.textContent = "ثبت مأموریت برای تاریخ آینده مجاز نیست."; errEl.hidden = false; return; }
    if (!DESTINATIONS.includes(dest)) { errEl.textContent = "مقصد انتخاب‌شده معتبر نیست."; errEl.hidden = false; return; }
    if (notes.length > 500) { errEl.textContent = "توضیحات بیش از حد طولانی است."; errEl.hidden = false; return; }

    // duplicate guard: same date + same destination (excluding the record being edited)
    const dup = state.missions.find(m =>
      m.date === date && m.dest === dest && m.id !== draft.id);
    if (dup) {
      const ok = await confirmDialog({
        title: "مأموریت تکراری",
        message: `در تاریخ <strong>${fmtLong(date)}</strong> مأموریتی با مقصد «${esc(dest)}» ثبت شده است.<br>آیا باز هم ثبت شود؟`,
        confirmText: "ثبت مجدد",
        cancelText: "انصراف"
      });
      if (!ok) return;
    }

    busy = true;
    saveBtn.disabled = true;
    saveBtn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px"></span> در حال ذخیره…`;

    const now = Date.now();
    if (draft.id) {
      const m = state.missions.find(x => x.id === draft.id);
      if (m) { m.date = date; m.dest = dest; m.notes = notes; m.updatedAt = now; }
    } else {
      state.missions.push({
        id: uid(), date, dest, notes, createdAt: now, updatedAt: now
      });
    }

    const okSave = persist();
    busy = false;
    saveBtn.disabled = false;
    if (!okSave) {
      saveBtn.innerHTML = "تلاش دوباره";
      errEl.textContent = "ذخیره‌سازی ناموفق بود. ممکن است فضای ذخیره‌سازی مرورگر پر شده باشد.";
      errEl.hidden = false;
      return;
    }
    closeModal();
    toast(draft.id ? "تغییرات ذخیره شد" : "مأموریت با موفقیت ثبت شد", "success");
    render();
  });
}

function resolveReportRange() {
  const t = todayISO();
  const r = state.report;
  if (r.preset === "today") {
    return { from: t, to: t, label: `روز ${fmtFull(t)}`, short: "گزارش روزانه" };
  }
  if (r.preset === "week") {
    const [s, e] = workweekRange(t);
    return { from: s, to: e, label: `هفته کاری ${fmtLong(s)} تا ${fmtLong(e)}`, short: "گزارش هفتگی" };
  }
  if (r.preset === "month") {
    const [s, e] = monthRange(t);
    const [jy, jm] = t.split("-").map(Number);
    return { from: s, to: e, label: `ماه ${JMONTHS[jm - 1]} ${faNum(jy)}`, short: "گزارش ماهانه" };
  }
  if (r.preset === "lastMonth") {
    const [s, e] = monthRange(shiftMonth(t, -1));
    const [jy, jm] = s.split("-").map(Number);
    return { from: s, to: e, label: `ماه ${JMONTHS[jm - 1]} ${faNum(jy)}`, short: "گزارش ماه گذشته" };
  }
  // custom
  let from = r.from, to = r.to;
  if (!isValidISO(from)) from = monthRange(t)[0];
  if (!isValidISO(to)) to = t;
  if (from > to) { const tmp = from; from = to; to = tmp; }
  const label = from === to ? `روز ${fmtFull(from)}` : `${fmtLong(from)} تا ${fmtLong(to)}`;
  return { from, to, label, short: "گزارش بازه دلخواه" };
}

  return state.missions.filter(m => m.date >= range.from && m.date <= range.to);

        </span>
      </td>
      <td class="pdf-meta" style="width:34%">
        <span class="pdf-lbl">بازه گزارش</span>
        <span class="pdf-val">${rng}</span>
      </td>
    </tr></table>

    ${summary}

    <div class="pdf-table-wrap">
      <table class="pdf-table">
        <colgroup>
          <col style="width:7%"><col style="width:19%"><col style="width:13%">
          <col style="width:23%"><col style="width:38%">
        </colgroup>
        <thead><tr>
          <th class="c">#</th><th>تاریخ</th><th class="c">روز هفته</th><th>مقصد</th><th>توضیحات</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>

    <div class="pdf-foot">
      <table><tr>
        <td>تاریخ تولید گزارش: ${fmtFull(todayISO())}</td>
        <td class="l pg">صفحه ${faNum(pageNo)} از ${faNum(totalPages)}</td>
      </tr></table>
    </div>
  </div>`;
}

function buildReportPages(range, items) {
  const chunks = [];
  if (!items.length) chunks.push({ rows: [], start: 0 });
  else {
    let i = 0;
    chunks.push({ rows: items.slice(0, PDF_ROWS_FIRST), start: 0 });
    i = PDF_ROWS_FIRST;
    while (i < items.length) {
      chunks.push({ rows: items.slice(i, i + PDF_ROWS_NEXT), start: i });
      i += PDF_ROWS_NEXT;
    }
  }
  const total = chunks.length;
  const stage = $("#pdf-stage");
  stage.innerHTML = chunks.map((c, idx) => buildPdfPageHTML({
    pageNo: idx + 1, totalPages: total, range, items: c.rows,
    allItems: items, startIndex: c.start, isFirst: idx === 0
  })).join("");
  return total;
}

function showLoading(title, sub) {
  const el = document.createElement("div");
  el.className = "loading-overlay";
  el.id = "loading-overlay";
  el.innerHTML = `<div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-txt">${esc(title)}</div>
    <div class="loading-sub">${esc(sub || "")}</div>
  </div>`;
  document.body.appendChild(el);
  return el;
}
function hideLoading() { const e = $("#loading-overlay"); if (e) e.remove(); }

async function waitForPaints(n = 2) {
  for (let i = 0; i < n; i++) {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  }
}

async function exportPDF() {
  if (typeof html2canvas !== "function" || !window.jspdf || !window.jspdf.jsPDF) {
    toast("کتابخانه تولید PDF بارگذاری نشد. اتصال اینترنت را بررسی کنید.", "error");
    return;
  }
  const range = resolveReportRange();
  const items = sortAsc(reportItems(range));

  const loader = showLoading("در حال ساخت فایل PDF…", "لطفاً صفحه را نبندید");

  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const totalPages = buildReportPages(range, items);
    await waitForPaints(3);

    const pages = $$("#pdf-stage .pdf-page");
    const scale = window.innerWidth < 768 ? 2 : 2.5;

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4", compress: true });
    const PW = pdf.internal.pageSize.getWidth();   // 595.28
    const PH = pdf.internal.pageSize.getHeight();  // 841.89

    for (let i = 0; i < pages.length; i++) {
      const el = pages[i];
      if (i > 0) pdf.addPage();
      const canvas = await html2canvas(el, {
        scale,
        backgroundColor: "#ffffff",
        useCORS: false,
        logging: false,
        width: el.offsetWidth,
        height: el.offsetHeight,
        windowWidth: el.offsetWidth,
        windowHeight: el.offsetHeight
      });
      const data = canvas.toDataURL("image/jpeg", 0.92);
      pdf.addImage(data, "JPEG", 0, 0, PW, PH, undefined, "FAST");
    }

    const name = `MissionLog-Report-${range.from}${range.from === range.to ? "" : "_to_" + range.to}.pdf`;
    pdf.save(name);
    toast("فایل PDF ساخته و دانلود شد", "success");
  } catch (err) {
    console.error(err);
    toast("ساخت PDF با خطا مواجه شد. دوباره تلاش کنید.", "error");
  } finally {
    hideLoading();
    $("#pdf-stage").innerHTML = "";
  }
}

async function printPDF() {
  const range = resolveReportRange();
  const items = sortAsc(reportItems(range));
  const loader = showLoading("در حال آماده‌سازی چاپ…", "");
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    buildReportPages(range, items);
    await waitForPaints(3);
    hideLoading();
    window.print();
    setTimeout(() => { $("#pdf-stage").innerHTML = ""; }, 1200);
  } catch (e) {
    hideLoading();
    toast("آماده‌سازی چاپ ناموفق بود", "error");
  }
}

/* ---------------------------- 17. SETTINGS / BACKUP -------------------- */
function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 400);
}
function exportBackup() {
  const payload = {
    app: "MissionLog2027",
    version: 1,
    exportedAt: new Date().toISOString(),
    count: state.missions.length,
    missions: sortAsc(state.missions)
  };
  downloadBlob(JSON.stringify(payload, null, 2),
    `MissionLog-backup-${todayISO()}.json`, "application/json;charset=utf-8");
  toast("فایل پشتیبان دانلود شد", "success");
}
function exportCSV() {
  const rows = [["تاریخ", "روز هفته", "مقصد", "توضیحات"]];
  sortAsc(state.missions).forEach(m => {
    rows.push([fmtLong(m.date), fmtWeekday(m.date), m.dest, (m.notes || "").replace(/\r?\n/g, " ")]);
  });
  const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  downloadBlob(csv, `MissionLog-missions-${todayISO()}.csv`, "text/csv;charset=utf-8");
  toast("خروجی CSV دانلود شد", "success");
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(String(reader.result)); }
    catch { toast("فایل پشتیبان معتبر نیست", "error"); return; }
    const list = Array.isArray(data) ? data : data && Array.isArray(data.missions) ? data.missions : null;
    if (!list) { toast("ساختار فایل پشتیبان شناسایی نشد", "error"); return; }

    const valid = list.filter(m => m && isValidISO(m.date) && DESTINATIONS.includes(m.dest));
    if (!valid.length) { toast("هیچ رکورد معتبری در فایل یافت نشد", "error"); return; }

    const ok = await confirmDialog({
      title: "بازیابی پشتیبان",
      message: `<strong>${faNum(valid.length)}</strong> رکورد معتبر در فایل پیدا شد.<br>
        رکوردهای جدید به داده‌های فعلی افزوده می‌شوند (رکوردهای تکراری نادیده گرفته می‌شوند).`,
      confirmText: "بازیابی",
      cancelText: "انصراف"
    });
    if (!ok) return;

    const existing = new Set(state.missions.map(m => `${m.date}|${m.dest}|${m.notes}|${m.createdAt}`));
    let added = 0;
    valid.forEach(m => {
      const key = `${m.date}|${m.dest}|${m.notes || ""}|${m.createdAt || 0}`;
      if (existing.has(key)) return;
      state.missions.push({
        id: typeof m.id === "string" ? m.id : uid(),
        date: m.date,
        dest: m.dest,
        notes: typeof m.notes === "string" ? m.notes.slice(0, 500) : "",
        createdAt: Number(m.createdAt) || Date.now(),
        updatedAt: Number(m.updatedAt) || Date.now()
      });
      added++;
    });
    persist();
    render();
    toast(`${faNum(added)} رکورد بازیابی شد`, "success");
  };
  reader.readAsText(file, "utf-8");
}

function renderSettings() {

  $("#view").innerHTML = `

        <div class="section-desc">مدیریت ظاهر، پشتیبان‌گیری و نگهداری اطلاعات</div>
      </div>
    </div>

    <section class="card card-pad">
      <div class="card-title" style="margin-bottom:12px">${icon("sun")} ظاهر برنامه</div>
      <div class="row-between">
        <div>

      </div>
      <div class="kv"><span class="kv-k">تعداد کل رکوردها</span><span class="kv-v tnum">${faNum(state.missions.length)}</span></div>
      <div class="kv"><span class="kv-k">حجم تقریبی داده</span><span class="kv-v tnum">${faNum(kb)} کیلوبایت</span></div>
      <div class="kv"><span class="kv-k">محل ذخیره‌سازی</span><span class="kv-v">حافظه محلی مرورگر</span></div>

      <div class="row mt-4" style="flex-wrap:wrap;gap:8px">

      </div>

      <div class="divider"></div>

        <div>
          <div style="font-size:13.5px;font-weight:600;color:var(--danger)">حذف تمام داده‌ها</div>
          <div class="hint">همه مأموریت‌ها برای همیشه پاک می‌شوند. ابتدا پشتیبان بگیرید.</div>
        </div>
        <button class="btn btn-sm" style="color:var(--danger);border-color:var(--border)" data-act="wipe">حذف همه</button>
      </div>
    </section>

    <section class="card card-pad mt-4">
      <div class="card-title" style="margin-bottom:10px">${icon("alert")} نکته درباره همگام‌سازی</div>
      <p class="hint" style="line-height:2">
        این نسخه به‌صورت «محلی‌محور» کار می‌کند: هیچ داده‌ای به سرور ارسال نمی‌شود و همگام‌سازی ابری بین دستگاه‌ها فعال نیست.
        برای انتقال داده به دستگاه دیگر، از «دانلود پشتیبان» استفاده کنید و در دستگاه مقصد «بازیابی از فایل» را اجرا کنید.
        اگر داده‌های مرورگر (Cookies/Site data) را پاک کنید، رکوردها نیز حذف می‌شوند؛ بنابراین تهیه پشتیبان دوره‌ای توصیه می‌شود.
      </p>
    </section>

    <div class="hint" style="text-align:center;margin-top:24px">MissionLog ۲۰۲۷ · نسخه ۱٫۰٫۰</div>
  </div>`;

  const fileInput = $("#import-file");
  if (fileInput) {
    fileInput.addEventListener("change", () => {
      if (fileInput.files && fileInput.files[0]) importBackup(fileInput.files[0]);
      fileInput.value = "";
    });
  }
}

/* ---------------------------- 18. ROUTER / EVENTS ---------------------- */
function render() {
  renderNav();
  if (state.view === "dashboard") renderDashboard();
  else if (state.view === "history") renderHistory();
  else if (state.view === "reports") renderReports();
  else renderSettings();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  switch (act) {
    case "nav": go(t.dataset.view); break;
    case "add": openMissionForm(null); break;
    case "edit": openMissionForm(t.dataset.id); break;
    case "del": deleteMission(t.dataset.id); break;

    case "theme": {
      const next = state.theme === "dark" ? "light" : "dark";
      applyTheme(next);
      if (state.view === "settings") render();
      break;
    }

    case "toggle-filters":
      state.filtersOpen = !state.filtersOpen;
      $(".filters")?.classList.toggle("collapsed", !state.filtersOpen);
      break;

    case "reset-filters":
      state.filters = { from: "", to: "", dest: "", weekday: "", month: "", q: "" };
      render();
      toast("فیلترها پاک شدند");
      break;

    case "pick-from":
      openDatePicker(state.filters.from || todayISO(), iso => {
        state.filters.from = iso;
        if (state.filters.to && state.filters.to < iso) state.filters.to = iso;
        renderHistory();
      });
      break;

    case "pick-to":
      openDatePicker(state.filters.to || todayISO(), iso => {
        state.filters.to = iso;
        if (state.filters.from && state.filters.from > iso) state.filters.from = iso;
        renderHistory();
      });
      break;

    case "preset":
      state.report.preset = t.dataset.preset;
      if (state.report.preset === "custom") {
        if (!isValidISO(state.report.from)) state.report.from = monthRange(todayISO())[0];
        if (!isValidISO(state.report.to)) state.report.to = todayISO();
      }
      renderReports();
      break;

    case "rep-from":
      openDatePicker(state.report.from || todayISO(), iso => {
        state.report.from = iso; state.report.preset = "custom"; renderReports();
      }, { max: todayISO() });
      break;

    case "rep-to":
      openDatePicker(state.report.to || todayISO(), iso => {
        state.report.to = iso; state.report.preset = "custom"; renderReports();
      }, { max: todayISO() });
      break;

    case "export-pdf": exportPDF(); break;
    case "print-pdf": printPDF(); break;

    case "export-backup": exportBackup(); break;
    case "export-csv": exportCSV(); break;
    case "import-backup": $("#import-file")?.click(); break;

    case "wipe": {
      const ok = await confirmDialog({
        title: "حذف تمام داده‌ها",
        message: `تمام <strong>${faNum(state.missions.length)}</strong> مأموریت ثبت‌شده برای همیشه حذف می‌شود.<br>
          <span class="muted">این عمل قابل بازگشت نیست. در صورت نیاز ابتدا پشتیبان بگیرید.</span>`,
        confirmText: "بله، همه را حذف کن",
        danger: true
      });
      if (!ok) return;
      state.missions = [];
      persist();
      render();
      toast("تمام داده‌ها حذف شد", "success");
      break;
    }
  }
});

document.addEventListener("input", e => {
  const el = e.target.closest("[data-filter]");
  if (!el) return;
  state.filters[el.dataset.filter] = el.value;
  if (el.dataset.filter === "q") renderHistoryList();
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-filter]");
  if (!el) return;
  state.filters[el.dataset.filter] = el.value;
  if (el.dataset.filter !== "q") renderHistoryList();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const dp = $(".dp-overlay");
    if (dp) { dp.remove(); lockScroll(!!$("#modal-overlay")); return; }
    if ($("#modal-overlay")) closeModal();
  }
});

window.addEventListener("hashchange", () => {
  const v = location.hash.replace("#/", "");
  if (NAV.some(n => n.view === v) && v !== state.view) {
    state.view = v;
    render();
  }
});
window.addEventListener("resize", () => {
  const tb = $(".topbar");
  if (tb) document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
});

/* ---------------------------- 19. BOOT --------------------------------- */
(function boot() {
  initTheme();
  state.missions = loadMissions();
  const initial = location.hash.replace("#/", "");
  if (NAV.some(n => n.view === initial)) state.view = initial;
  render();
  renderNav();
})();
</script>
